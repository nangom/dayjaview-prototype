<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DAY-JA-VIEW</title>
    <meta name="description" content="장 마감 후 테마 순위와 과거 부각 사례 이후 성과" />

    <!-- PWA: 홈 화면에 추가하면 주소창 없이 전체화면으로 뜬다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#EFEEEB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default: iOS 가 상태바 자리를 확보해 준다. black-translucent 로 바꾸면
         콘텐츠가 상태바 밑으로 들어가므로 안전영역 처리를 다시 봐야 한다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="데자뷰" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  </head>
